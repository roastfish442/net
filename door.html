<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>door</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #1434a7;
            font-family: sans-serif;
        }

        .container {
            text-align: center;
        }

        /* 门容器 - 用 div */
        .door {
            width: 225px;
            height: 470px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
        }

        .door img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
        }

        /* 门缝 - 悬停显示 */
        .door .crack {
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .door:hover .crack {
            opacity: 1;
        }

        /* 新图片 - 默认隐藏 */
        .door .new-image {
            opacity: 0;
            transition: opacity 0.35s ease;
            z-index: 2;
            pointer-events: none;  /* 默认不可点击 */
        }

        /* 开门状态：用 class 控制 */
        .door.open .new-image {
            opacity: 1;
            pointer-events: auto;  /* 可点击跳转 */
        }
        .door.open .base {
            opacity: 0;
        }
        .door.open .crack {
            opacity: 0;
        }

        /* 新图片本身变成可点击区域 - 用 a 标签包裹新图片 */
        .door .new-link {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .door.open .new-link {
            opacity: 1;
            pointer-events: auto;
        }
        .new-link a {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 提示文字 */
        .hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            white-space: nowrap;
        }
        .door.open .hint {
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="door" id="door">
        <!-- 门图片 -->
        <img class="base" src="img/door.png" alt="门">
        
        <!-- 门缝图片 -->
        <img class="crack" src="img/door1.png" alt="门缝">
        
        <!-- 新图片（显示在门上） -->
        <img class="new-image" src="img/door2.png" alt="新图片">

        <!-- 点击跳转的链接（覆盖在新图片上） -->
        <div class="new-link">
            <a href="https://store.steampowered.com/app/4706370/_/" target="_blank"></a>
        </div>

       
    </div>
</div>

<script>
    // 极简 JS：点击门 → 切换 open 类
    document.getElementById('door').addEventListener('click', function(e) {
        // 如果点击的是新图片上的链接，不处理（让链接自己跳转）
        if (e.target.closest('.new-link')) return;
        
        // 切换开门状态
        this.classList.toggle('open');
    });
</script>

</body>
</html>
